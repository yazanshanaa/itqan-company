name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # server.js needs MongoDB (sessions + site data) to boot
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Generate throwaway test credentials
      # Random values per run: nothing secret lives in the repo. The admin hash is
      # seeded into the empty CI database by lib/seed.js on server start.
      run: |
        PASS=$(openssl rand -hex 16)
        echo "::add-mask::$PASS"
        echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
        echo "TEST_ADMIN_PASS=$PASS" >> "$GITHUB_ENV"
        echo "ADMIN_PASS_HASH=$(node -e "console.log(require('bcryptjs').hashSync(process.argv[1], 10))" "$PASS")" >> "$GITHUB_ENV"
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
